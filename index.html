<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food &amp; Shopping Tracker</title>
  <meta name="description" content="Weekly meal plan + shopping list for a couple. Next 3-day purchase alerts.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
</head>
<body>

<header>
  <div class="header-brand">
    <span class="brand-icon">🥗</span>
    <span class="brand-name">Food &amp; Shopping</span>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn"        data-lang="uk">UK</button>
    </div>
  </div>
  <nav>
    <button class="nav-btn active" data-page="home">🏠 Home</button>
    <button class="nav-btn"        data-page="plan">📅 Meal Plan</button>
    <button class="nav-btn"        data-page="shopping">🛒 Shopping</button>
  </nav>
</header>

<main id="app">
  <p style="padding:40px;text-align:center;color:#6B7C74">Loading…</p>
</main>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
